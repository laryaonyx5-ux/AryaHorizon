name: Build Android APK (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - arya/full-android-safe-area

permissions:
  contents: read

concurrency:
  group: build-apk-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile ARM64 preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null

      - name: Install Rust Android target and cargo-ndk
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component rust-src --target aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64-preview

      - name: Prepare Android native libraries
        run: python3 tools/android_native_sdk.py prepare

      - name: Build preview APK
        env:
          ABI: arm64-v8a
          RUSTFLAGS: -C prefer-dynamic
        run: |
          python3 packaging/android/build_apk.py \
            --abi "$ABI" \
            --profile quick \
            --preview

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AryaHorizon-Android-ARM64-Preview
          path: target/android/starling-*.apk
          if-no-files-found: error
          retention-days: 14
